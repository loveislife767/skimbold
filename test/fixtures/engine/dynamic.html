<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic page</title>
</head>
<body>
<main id="page">
  <section id="left">
    <p id="first">Morning light spreads across the harbour</p>
    <p id="second">Fishing boats return with their catch</p>
    <p id="third">Gulls circle above the market stalls</p>
    <p id="mixed">Tides turn <em>slowly</em> near the pier</p>
  </section>
  <section id="right">
    <p id="anchor">Evening falls over quiet water</p>
  </section>
  <div id="feed"></div>
</main>
</body>
</html>
